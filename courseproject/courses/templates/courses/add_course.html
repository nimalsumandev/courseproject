<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Course</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; padding: 40px; }
        .form-card { width: 400px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .btn { display: inline-block; width: 100%; padding: 10px; background: #27ae60; color: white; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
        .btn:hover { background: #219150; }
        .btn-secondary { display: block; text-align: center; margin-top: 10px; color: #7f8c8d; text-decoration: none; font-size: 0.9rem; }
        .btn-secondary:hover { text-decoration: underline; }
        .error { color: red; font-size: 0.9rem; display: none; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="form-card">
        <h2>Add New Course</h2>
        <div id="error-msg" class="error">All fields are required!</div>
        <form id="courseForm" method="POST" onsubmit="return validateForm()">
            {% csrf_token %}
            <div class="form-group">
                <label>Course Name</label>
                <input type="text" id="course_name" name="course_name">
            </div>
            <div class="form-group">
                <label>Course Code</label>
                <input type="text" id="course_code" name="course_code">
            </div>
            <div class="form-group">
                <label>Duration</label>
                <input type="text" id="duration" name="duration">
            </div>
            <div class="form-group">
                <label>Fee</label>
                <input type="text" id="fee" name="fee">
            </div>
            <button type="submit" class="btn">Save Course</button>
            <a href="{% url 'course_list' %}" class="btn-secondary">Back to Course List</a>
        </form>
    </div>

    <script>
        function validateForm() {
            var name = document.getElementById('course_name').value.trim();
            var code = document.getElementById('course_code').value.trim();
            var duration = document.getElementById('duration').value.trim();
            var fee = document.getElementById('fee').value.trim();
            var errorMsg = document.getElementById('error-msg');

            if (name === "" || code === "" || duration === "" || fee === "") {
                errorMsg.style.display = "block";
                return false;
            }
            errorMsg.style.display = "none";
            return true;
        }
    </script>
</body>
</html>

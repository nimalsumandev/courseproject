<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; padding: 40px; }
        .form-card { width: 380px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; }
        .btn { width: 100%; padding: 10px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 15px; font-size: 1rem; }
        .btn:hover { background: #219150; }
        .auth-link { text-align: center; margin-top: 15px; font-size: 0.9rem; }
        .auth-link a { color: #3498db; text-decoration: none; }
        .auth-link a:hover { text-decoration: underline; }
        .helptext { font-size: 0.8rem; color: #7f8c8d; display: block; margin-top: 4px; }
        ul.errorlist { color: #e74c3c; padding-left: 20px; font-size: 0.85rem; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="form-card">
        <h2>Sign Up</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Register</button>
        </form>
        <div class="auth-link">
            Already have an account? <a href="{% url 'login' %}">Login here</a>
        </div>
    </div>
</body>
</html>

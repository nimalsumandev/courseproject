<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; padding: 40px; }
        .form-card { width: 380px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; }
        .btn { width: 100%; padding: 10px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 15px; font-size: 1rem; }
        .btn:hover { background: #2980b9; }
        .error { color: #e74c3c; text-align: center; margin-bottom: 10px; font-size: 0.9rem; }
        .auth-link { text-align: center; margin-top: 15px; font-size: 0.9rem; }
        .auth-link a { color: #3498db; text-decoration: none; }
        .auth-link a:hover { text-decoration: underline; }
        ul.errorlist { color: #e74c3c; padding-left: 20px; font-size: 0.85rem; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="form-card">
        <h2>Login</h2>
        {% if error_message %}
            <div class="error">{{ error_message }}</div>
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Login</button>
        </form>
        <div class="auth-link">
            Don't have an account? <a href="{% url 'signup' %}">Sign up here</a>
        </div>
    </div>
</body>
</html>
